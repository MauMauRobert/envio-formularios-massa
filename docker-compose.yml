services:
  app:
    image: ${APP_IMAGE:-envio-formularios:latest}
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: ${BASE_URL:-}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
  caddy:
    image: caddy:2-alpine
    command: reverse-proxy --from ${DOMINIO} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
volumes:
  app-data:
  caddy-data:
