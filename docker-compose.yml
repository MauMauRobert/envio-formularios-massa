services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: ${BASE_URL:-}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped
volumes:
  app-data:
  caddy-data:
