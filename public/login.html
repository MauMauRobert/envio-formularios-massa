<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — envio de formulários</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topo">
  <div>
    <h1>Envio de formulários em massa</h1>
    <p id="subtitulo">Área restrita</p>
  </div>
</header>

<main class="conteudo">
  <div id="alerta" class="alerta oculto"></div>

  <section class="cartao" style="max-width:420px;margin:0 auto">
    <h2 id="tituloLogin">Entrar</h2>
    <p class="dica" id="dicaLogin">Acesso ao painel de campanhas.</p>
    <div class="campo"><label for="loginUsuario">Usuário</label><input id="loginUsuario" autocomplete="username"></div>
    <div class="campo"><label for="loginSenha">Senha</label><input id="loginSenha" type="password" autocomplete="current-password"></div>
    <button class="primario" id="btnEntrar" style="width:100%">Entrar</button>
  </section>
</main>

<script src="/login.js"></script>
</body>
</html>
